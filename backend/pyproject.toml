[project]
name = "fris-backend"
version = "0.1.0"
description = "Faculty Research Intelligence System - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.10.1,<3.0",
    "pydantic-settings>=2.9.1,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.14.0,<2.0",
    "PyJWT>=2.10.1,<3.0",
    "passlib[argon2]>=1.7.4,<2.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0,<1.0",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.10.0,<4.0",
    "prefect>=3.1.0,<4.0",
    "structlog>=24.4.0,<25.0",
    "python-dotenv>=1.0.0,<2.0",
    "tenacity>=9.0.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0.0,<2.0",
    "pytest-cov>=6.0.0,<7.0",
    "httpx",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "bandit>=1.8.0,<2.0",
    "pip-audit>=2.7.0,<3.0",
    "factory-boy>=3.3.0,<4.0",
    "setuptools>=84.1.0",
    "types-passlib>=1.7.7.20250602,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "T20"]
ignore = ["B008", "S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database",
    "contract: Connector contract tests with mocks",
    "live: Live provider tests requiring network",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
