services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fris}
      POSTGRES_USER: ${POSTGRES_USER:-fris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fris} -d ${POSTGRES_DB:-fris}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prefect-server:
    image: prefecthq/prefect:3-latest
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:4200/api/health').raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 10

  prefect-bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-fris-pool}
    depends_on:
      prefect-server:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        if ! prefect work-pool inspect "$${PREFECT_WORK_POOL}" >/dev/null 2>&1; then
          prefect work-pool create "$${PREFECT_WORK_POOL}" --type process
        fi
        prefect deploy app/workflows/discovery.py:discovery_flow \
          --name manual \
          --pool "$${PREFECT_WORK_POOL}" \
          --concurrency-limit 1

  prefect-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fris}
      POSTGRES_USER: ${POSTGRES_USER:-fris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      APP_ENV: ${APP_ENV:-development}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      prefect-bootstrap:
        condition: service_completed_successfully
    command: ["prefect", "worker", "start", "--pool", "${PREFECT_WORK_POOL:-fris-pool}"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fris}
      POSTGRES_USER: ${POSTGRES_USER:-fris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      APP_ENV: ${APP_ENV:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-CHANGE_ME_admin_password}
      FRIS_SEED_DEMO: ${FRIS_SEED_DEMO:-false}
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_DEPLOYMENT_NAME: ${PREFECT_DEPLOYMENT_NAME:-fris-discovery/manual}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      prefect-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: ["python", "-m", "app.bootstrap"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
