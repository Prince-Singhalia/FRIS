name: FRIS quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build frontend runtime image
        run: docker build --tag fris-frontend:ci .
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fris-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Smoke-test frontend runtime image
        run: |
          docker run --detach --name fris-frontend-smoke --publish 127.0.0.1:8080:8080 fris-frontend:ci
          trap 'docker rm --force fris-frontend-smoke' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 2 --fail http://127.0.0.1:8080/ \
            | grep -q 'FRIS · Research intelligence'

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fris_test
          POSTGRES_USER: fris
          POSTGRES_PASSWORD: fris_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fris -d fris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fris_test
      POSTGRES_USER: fris
      POSTGRES_PASSWORD: fris_test_password
      SECRET_KEY: integration-test-only-secret-key-not-used-in-production
      FRIS_TEST_DATABASE_URL: postgresql+asyncpg://fris:fris_test_password@localhost:5432/fris_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Run PostgreSQL API integration tests
        run: python -m pytest -q tests/integration

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check app tests
      - name: Run mypy
        run: python -m mypy app
      - name: Run Bandit
        run: python -m bandit -q -r app
      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable
      - name: Build runtime image
        run: docker build --tag fris-backend:ci .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fris-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
