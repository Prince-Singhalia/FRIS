name: Backend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check app tests
      - name: Run mypy
        run: python -m mypy app
      - name: Run Bandit
        run: python -m bandit -q -r app
      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable
      - name: Build runtime image
        run: docker build --tag fris-backend:ci .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fris-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
